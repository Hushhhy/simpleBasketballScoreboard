<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Scrimba Basketball Scoreboard</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <button class="new-game-btn" onclick="restart()">NEW GAME</button>
        <div class="container">
            <div class="team">
                <h3>HOME</h3>
                <h2 class="points" id="hPoint-el">0</h2>
                <div class="btn-el">
                    <button onclick="addOneHome()">+1</button>
                    <button onclick="addTwoHome()">+2</button>
                    <button onclick="addThreeHome()">+3</button>
                </div>
            </div>
            <div class="team period">
                <h3>PERIOD</h3>
                <h2 class="points" id="period-el">1</h2>
                <div class="btn-el">
                    <button onclick="addOnePeriod()">+1</button>
                </div>
            </div>
            <div class="team">
                <h3>GUEST</h3>
                <h2 class="points" id="gPoint-el">0</h2>
                <div class="btn-el">
                    <button onclick="addOneGuest()">+1</button>
                    <button onclick="addTwoGuest()">+2</button>
                    <button onclick="addThreeGuest()">+3</button>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
